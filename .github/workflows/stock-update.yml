name: 股价更新（每2小时）

# 可选：账单锁定期间若不想持续收到失败通知，把下面 schedule 两行注释掉（保留 workflow_dispatch），解锁后取消注释即可恢复。
on:
  schedule:
    - cron: '0 */2 * * *'  # 每2小时
  workflow_dispatch:

permissions:
  contents: write

# 与日知录更新共用同一组，避免 00:00 两个定时任务并发 push 冲突
concurrency:
  group: repo-content-writes
  cancel-in-progress: false

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取股价
        run: python scripts/fetch_stocks.py
      - name: 重新生成页面
        run: python scripts/generate_html.py
      - name: 提交推送
        run: |
          git config user.name "TechNewsBot"
          git config user.email "bot@tech-news"
          git add docs/
          git diff --staged --quiet || git commit -m "📈 股价更新 $(date +'%Y-%m-%d %H:%M')"
          git push
